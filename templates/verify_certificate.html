<!DOCTYPE html>
<html>
<head>
    <title>Certificate Verification</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

    body{
        background:#f4f7fc;
        font-family:Arial,sans-serif;
    }

    .verify-box{
        width:500px;
        margin:60px auto;
        background:white;
        padding:30px;
        border-radius:15px;
        box-shadow:0 5px 20px rgba(0,0,0,0.15);
        text-align:center;
    }

    .verify-box img{
        width:90px;
        margin-bottom:15px;
    }

    .verify-box h1{
        color:#0d47a1;
        margin-bottom:10px;
    }

    .verify-box p{
        color:#555;
        margin-bottom:20px;
    }

    input{
        width:90%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:8px;
        margin-bottom:15px;
    }

    button{
        background:#0d47a1;
        color:white;
        border:none;
        padding:12px 25px;
        border-radius:8px;
        cursor:pointer;
        font-weight:bold;
    }

    button:hover{
        background:#08306b;
    }

    </style>

</head>

<body>

<div class="verify-box">

    <img src="{{ url_for('static', filename='images/logo.png') }}">

    <h1>SANGITA EDUCATION</h1>

    <p>Certificate Verification Portal</p>

    <form action="/verify_certificate" method="POST">

        <input
            type="text"
            name="student_id"
            placeholder="Enter Student ID (SETF0001)"
            required>

        <br>

        <button type="submit">
            ✅ Verify Certificate
        </button>

    </form>

</div>

</body>
</html>
